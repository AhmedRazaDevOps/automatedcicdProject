name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Triggers when you push code to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ahmedrazadevops # 👈 Your explicit Docker Hub username
          password: ${{ secrets.DOCKER_PASSWORD }} # Your Access Token saved in repo secrets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push .NET API
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apis
          push: true
          tags: ahmedrazadevops/proj2-api:latest

      # Build and push Next.js Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ahmedrazadevops/proj2-frontend:latest

      # Build and push Vue Panel
      - name: Build and Push Panel Image
        uses: docker/build-push-action@v5
        with:
          context: ./panel
          push: true
          tags: ahmedrazadevops/proj2-panel:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push # Only triggers if all images successfully push to Docker Hub
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the application directory on EC2
            mkdir -p ~/app
            cd ~/app

            # Authenticate EC2 Docker CLI with Docker Hub using your access token
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "ahmedrazadevops" --password-stdin

            # Pull down the absolute latest image tags
            docker compose -f docker-compose.prod.yml pull

            # Spin up the containers using the fresh pulled images
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Prune out any old, dangling images from the EC2 drive to save space
            docker image prune -f
